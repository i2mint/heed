[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heed"
version = "0.0.1"
description = "Embeddable, no-install, framework-agnostic end-user feedback / bug-report / feature-request capability with a pluggable backend (standalone; optional enlace add-on)"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "feedback",
    "bug-report",
    "feature-request",
    "widget",
    "embeddable",
    "github",
    "fastapi",
    "enlace",
]
authors = [{ name = "Thor Whalen" }]
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.115.7",
    # Request.form(max_part_size=...) (starlette 0.44) for the payload caps.
    "starlette>=0.44",
    "python-multipart>=0.0.18",
    # CapacityLimiter built outside an event loop: one thread pool per blocking kind.
    "anyio>=4.5",
    "dol>=0.3.37",
    # enlace.ratelimit: the shared trusted-proxy client address + limiters (#97 there).
    "enlace>=0.1.62",
]

[project.license]
text = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/i2mint/heed"

[project.scripts]
heed = "heed.__main__:main"

[project.optional-dependencies]
# The GitHub sink (brokers issue/discussion creation via a GitHub App or token).
github = ["ghapi>=1.0"]
# Shared rate limiting across workers/hosts (rate_limit_backend="redis").
redis = ["redis>=4.2"]
# Kept as an alias for existing installs: enlace is now a core dependency (for
# enlace.ratelimit), so this extra adds nothing.
enlace = ["enlace>=0.1.62"]
# Re-encode uploaded screenshots (screenshot_sanitizer="reencode"; "auto" uses it
# when present). Without it, heed strips images structurally in pure Python.
images = ["Pillow>=10.0"]
# Expose the feedback queue to a coding agent (e.g. Claude Code) over MCP.
mcp = ["py2mcp>=0.1.0"]
# Test/dev tooling. `fastapi.testclient` delegates to `starlette.testclient`,
# which needs an HTTP client at import time: starlette >=1 prefers `httpx2` and
# only falls back to `httpx` with a deprecation warning, while starlette <1
# knows `httpx` alone. Both are declared so the suite collects on either
# resolution; they are distinct top-level modules and coexist fine.
dev = ["pytest", "httpx", "httpx2", "pytest-asyncio", "Pillow>=10.0"]

[tool.pytest.ini_options]
# wads CI runs `pytest --doctest-modules` with NO path argument, so collection is
# driven entirely by `testpaths`. The package dir must be listed here or none of
# its doctests ever run.
testpaths = ["tests", "heed"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D100"]
ignore = ["D203"]

[tool.wads.ci]
installer = "uv"

[tool.wads.ci.install]
# CI installs only the core dependencies unless extras are named here. The test
# suite needs the `dev` extra (its HTTP client in particular), so opt in.
extras = "dev"

[tool.wads.ci.publish]
# Design phase: do NOT auto-publish to PyPI on main pushes.
# NOTE: the PyPI name `heed` is NOT available -- it is taken by an unrelated
# project. A first release therefore needs a different distribution name (the
# import package can stay `heed`). See the repo issues for that decision.
enabled = false

[tool.wads.ci.testing]
python_versions = ["3.10", "3.12"]
coverage_enabled = false
test_on_windows = false

[tool.hatch.build.targets.wheel]
packages = ["heed"]
